conky.config = {

	update_interval = 1,
	cpu_avg_samples = 2,
	net_avg_samples = 2,
	out_to_console = false,
	override_utf8_locale = true,
	double_buffer = true,
	no_buffers = true,
	text_buffer_size = 32768,
	imlib_cache_size = 0,
	own_window = true,
	own_window_type = 'normal',
	own_window_argb_visual = true,
	own_window_argb_value = 50,
	own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
	border_inner_margin = 5,
	border_outer_margin = 0,
	xinerama_head = 1,
	gap_x = 0,
	gap_y = 30,
	draw_shades = false,
	draw_outline = false,
	draw_borders = false,
	draw_graph_borders = true,
	use_xft = true,
	font = 'Ubuntu Mono:size=12',
	xftalpha = 0.8,
	uppercase = false,
	default_color = '4d80df',
	own_window_colour = '#000000',
	minimum_width = 300, minimum_height = 0,
	alignment = 'top_right',

};

conky.text = [[
${font sans-serif:bold:size=16}${alignc}${time %H:%M}${font}
${voffset 4}${alignc}${time %A %B %d, %Y}
${font}${voffset -4}

${font sans-serif:bold:size=12}SYSTEM ${hr 2}
${font sans-serif:normal:size=10}
${execi 86400 lsb_release -sir}
Kernel: ${kernel}
User: $alignr ${exec users | cut -d " " -f1}@${nodename}
Uptime: $alignr $uptime

${font sans-serif:bold:size=12}CPU ${hr 2}
${font sans-serif:normal:size=10}
${execi 1000 grep "model name" /proc/cpuinfo | head -1 | cut -d: -f2 | sed 's/^ *//'}
__TEMP_ROW__
__GPU_ROW__
__FAN_ROW__
__CPU_BARS__
Load: $alignr ${loadavg 1}  ${loadavg 2}  ${loadavg 3}

__TOP_BEGIN__
${font sans-serif:bold:size=12}TOP ${hr 2}
${font sans-serif:normal:size=10}
${color 6699dd}Process              CPU    MEM${color}
__TOP_ROWS__
__TOP_END__

${font sans-serif:bold:size=12}MEMORY ${hr 2}
${font sans-serif:normal:size=10}
RAM $alignc $mem / $memmax $alignr $memperc%
${if_match ${memperc}>80}${color ff4444}${else}${if_match ${memperc}>60}${color ffaa00}${else}${color 4d80df}${endif}${endif}$membar${color}
SWAP $alignc ${swap} / ${swapmax} $alignr ${swapperc}%
${if_match ${swapperc}>80}${color ff4444}${else}${if_match ${swapperc}>60}${color ffaa00}${else}${color 4d80df}${endif}${endif}${swapbar}${color}

${font sans-serif:bold:size=12}FILE SYSTEM ${font sans-serif:normal:size=10}(${fs_type}) ${hr 2}

__ROOT_LABEL__ $alignc ${fs_used /} / ${fs_size /} $alignr ${fs_used_perc /}%
${if_match ${fs_used_perc /}>80}${color ff4444}${else}${if_match ${fs_used_perc /}>60}${color ffaa00}${else}${color 4d80df}${endif}${endif}${fs_bar /}${color}
__HOME_ROWS__

${execpi 300 /opt/scripts/conky-syslinuxos.sh}
${font sans-serif:bold:size=12}NETWORK ${hr 2}
${font sans-serif:normal:size=10}Local IP:${alignr}External IP:
${execi 60 ip -4 route get 1.1.1.1 2>/dev/null | awk '/src/{print $7}'}${alignr}${execi 300 curl -4fsS --max-time 5 https://api.ipify.org 2>/dev/null || echo N/A}
ISP:${alignr}${execi 3600 curl -s ipinfo.io/org | sed 's/^[^ ]* //' | tr -d '"'}
${execpi 10 /opt/scripts/conky-net.sh}
${downspeedgraph __NET_IFACE__ 30,150 cc9900 cc0000 -t}${upspeedgraph __NET_IFACE__ 30,180 cc9900 cc0000 -t}

]];
